<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>채팅 WebSocket 테스트 (임시)</title>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<style>
body { font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
.panel { flex: 1; border: 1px solid #ccc; padding: 10px; }
.log { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 5px; font-size: 12px; white-space: pre-wrap; }
input { width: 90%; }
textarea { width: 95%; height: 4.5em; resize: none; overflow-wrap: break-word; word-break: break-all; white-space: pre-wrap; }
</style>
</head>
<body>
  <p>채팅방 ID: <input id="roomId" value="1" size="4"> (미리 SQL로 chat_rooms에 넣어둔 id)</p>
  <div class="panel">
    <h3>User A</h3>
    <input id="emailA" placeholder="email" value="testA@example.com"><br>
    <input id="passwordA" placeholder="password" type="password" value="Test1234!"><br>
    <button onclick="login('A')">Login</button>
    <textarea id="tokenA" placeholder="Login 누르면 자동으로 채워짐 (직접 붙여넣어도 됨)"></textarea><br>
    <button onclick="connect('A')">Connect</button>
    <input id="msgA" placeholder="message">
    <button onclick="send('A')">Send</button>
    <div id="logA" class="log"></div>
  </div>
  <div class="panel">
    <h3>User B</h3>
    <input id="emailB" placeholder="email" value="testB@example.com"><br>
    <input id="passwordB" placeholder="password" type="password" value="Test1234!"><br>
    <button onclick="login('B')">Login</button>
    <textarea id="tokenB" placeholder="Login 누르면 자동으로 채워짐 (직접 붙여넣어도 됨)"></textarea><br>
    <button onclick="connect('B')">Connect</button>
    <input id="msgB" placeholder="message">
    <button onclick="send('B')">Send</button>
    <div id="logB" class="log"></div>
  </div>

<script>
const clients = {};

function roomId() {
  return Number(document.getElementById('roomId').value);
}

function log(who, text) {
  const el = document.getElementById('log' + who);
  el.textContent += text + "\n";
  el.scrollTop = el.scrollHeight;
}

async function login(who) {
  const email = document.getElementById('email' + who).value.trim();
  const password = document.getElementById('password' + who).value;
  const tokenField = document.getElementById('token' + who);
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      log(who, '!!! LOGIN FAILED: ' + JSON.stringify(data));
      return;
    }
    tokenField.value = data.accessToken;
    log(who, '>>> LOGIN OK (' + email + ')');
  } catch (e) {
    log(who, '!!! LOGIN ERROR: ' + e);
  }
}

function connect(who) {
  const token = document.getElementById('token' + who).value.trim();
  const client = new StompJs.Client({
    webSocketFactory: () => new SockJS(window.location.origin + '/ws'),
    connectHeaders: { Authorization: 'Bearer ' + token },
    onConnect: () => {
      log(who, '>>> CONNECTED');
      client.subscribe('/topic/chat-rooms/' + roomId(), (msg) => {
        const data = JSON.parse(msg.body);
        log(who, `[${data.senderNickname}] ${data.content} : ${data.createdAt}`);
      });
    },
    onStompError: (frame) => {
      log(who, '!!! STOMP ERROR: ' + JSON.stringify(frame.headers) + ' ' + frame.body);
    },
    onWebSocketError: () => {
      log(who, '!!! WS ERROR');
    },
  });
  client.activate();
  clients[who] = client;
}

function send(who) {
  const client = clients[who];
  const text = document.getElementById('msg' + who).value;
  if (!client || !client.connected) { log(who, '!!! not connected'); return; }
  client.publish({
    destination: '/app/chat.send',
    body: JSON.stringify({ chatRoomId: roomId(), content: text, messageType: 'TEXT' })
  });
  log(who, '>>> SENT: ' + text);
}
</script>
</body>
</html>
