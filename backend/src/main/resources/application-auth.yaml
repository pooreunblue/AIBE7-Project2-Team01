app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiry: 15m
      refresh-token-expiry: 14d
---
spring:
  config:
    activate:
      on-profile: dev
  security:
    user:
      name: user
      password: test

    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email